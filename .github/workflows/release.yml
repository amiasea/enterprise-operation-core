name: Release Operation Core

on:
  workflow_call:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Download NuGet package
        uses: actions/download-artifact@v8.0.2
        with:
          name: nuget-package
          path: artifacts

      - name: Create GitHub release and upload package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/*.nupkg --repo "$REPO" --clobber
          else
            gh release create "$TAG" artifacts/*.nupkg \
              --repo "$REPO" \
              --title "$TAG" \
              --generate-notes
          fi
