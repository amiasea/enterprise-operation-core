name: Operation Core CI/CD

on:
  push:
    branches:
      - gamma-development
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: operation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Validate SemVer tag and gamma-main ancestry
        id: validate
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"

          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid v-prefixed SemVer tag."
            exit 1
          fi

          git fetch origin gamma-main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/gamma-main; then
            echo "::error::Tag '$TAG' does not point to a commit reachable from gamma-main."
            exit 1
          fi

          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build-development:
    if: github.ref == 'refs/heads/gamma-development'
    uses: ./.github/workflows/build.yml
    with:
      package-version: ${{ format('0.0.0-gamma-development.{0}', github.run_number) }}

  build-release:
    if: startsWith(github.ref, 'refs/tags/') && needs.validate-tag.result == 'success'
    needs: validate-tag
    uses: ./.github/workflows/build.yml
    with:
      package-version: ${{ needs.validate-tag.outputs.version }}

  release:
    needs: build-release
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml

  publish:
    needs: build-release
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish.yml
